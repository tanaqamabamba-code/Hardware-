<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tanbuild</title>
</head>
<body style="background:#fff;color:#000;font-family:monospace;padding:20px;">
  <div id="root"></div>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      document.body.innerHTML = '<pre style="white-space:pre-wrap;color:red;">ERROR: ' + msg + '\nLine: ' + line + ':' + col + '\n\n' + (error && error.stack ? error.stack : '') + '</pre>';
      return false;
    };
  </script>
  <script src="bundle.js"></script>
</body>
</html>
